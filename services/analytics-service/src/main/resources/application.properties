spring.application.name=analytics-service
spring.main.banner-mode=off
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8082}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.max-http-request-header-size=8KB
server.tomcat.connection-timeout=10s
server.tomcat.threads.max=80
server.tomcat.max-connections=128
server.tomcat.accept-count=32
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,dependencies
management.endpoint.health.cache.time-to-live=10s
logging.structured.format.console=logstash
logging.level.software.amazon.kinesis=WARN
logging.level.software.amazon.awssdk=WARN
commerce.aws-region=${AWS_REGION}
commerce.kinesis-endpoint=${KINESIS_ENDPOINT:}
commerce.stream=${KINESIS_STREAM}
commerce.http-rate=${HTTP_RATE:10}
commerce.http-in-flight=${HTTP_IN_FLIGHT:8}
commerce.cors-origins=${CORS_ORIGINS:}
commerce.dynamodb-endpoint=${DYNAMODB_ENDPOINT:}
commerce.analytics-table=${ANALYTICS_TABLE}
commerce.processed-table=${PROCESSED_TABLE}
commerce.quarantine-table=${QUARANTINE_TABLE}
commerce.dataset=${DATASET_ID}
commerce.stripes=${AGGREGATE_STRIPES:16}
commerce.kcl-application=${KCL_APPLICATION}
commerce.lease-table=${KCL_LEASE_TABLE}
commerce.worker-metrics-table=${KCL_WORKER_METRICS_TABLE}
commerce.coordinator-table=${KCL_COORDINATOR_TABLE}
commerce.cloudwatch-metrics=${CLOUDWATCH_METRICS:false}
commerce.worker-metric=${KCL_WORKER_METRIC:AUTO}
logging.structured.json.add.service=${spring.application.name}
logging.structured.json.add.environment=${APP_ENVIRONMENT:local}
